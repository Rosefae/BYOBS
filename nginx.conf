events {}
http {
    upstream byobs {
        server byobs:8081;
    }
    server {
        listen 8081;

        location /api {
            proxy_pass http://byobs;
            proxy_redirect default;
        }
        location /welcome {
            proxy_pass http://byobs;
            proxy_redirect default;
        }
        location /renders {
            proxy_pass http://byobs;
            proxy_redirect default;
        }
        location /testing {
            proxy_pass http://byobs;
            proxy_redirect default;
        }
    }
    server {
        listen 8082;

        location /config {
            proxy_pass http://byobs;
            proxy_redirect default;
        }
    }
}