services:
  byobs:
    container_name: byobs
    environment:
      - TZ=America/Toronto
    volumes:
      - ./data:/app/data
      - ./renders:/app/renders
    build:
      context: .
    ports:
      - 8081
  reverseproxy:
    image: nginx:1.25.5
    ports:
      - 8081:8081
      - 8082:8082
    restart: always
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf