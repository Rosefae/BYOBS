services:
  byobs:
    container_name: byobs
    environment:
      - TZ=America/Toronto
    volumes:
      - ./data:/app/data
      - ./renders:/app/renders
    build:
      context: .
      args:
        - DATA_GROUP_OWNER_ID=1001
    ports:
      - 8081
  reverseproxy:
    image: nginx:1.25.5
    ports:
      - 8083:8081
      - 8084:8082
    restart: always
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
