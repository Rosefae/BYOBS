<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>BYOBS!</title>
        <link rel="stylesheet" href="/style.css">
        <script src="/script.js" defer></script>
    </head>
    <body>
        <h1>BYOBS Device Configuration</h1>

        <form id="device-config" class="device-config">
            <table id="device-table" class="device-table">
                <thead>
                    <tr>
                        <th id="table-heading-id">ID</th>
                        <th id="table-heading-name">Name</th>
                        <th id="table-heading-width">Width</th>
                        <th id="table-heading-height">Height</th>
                        <th id="table-heading-preferbmp">Prefer BMP</th>
                        <th id="table-heading-grayscale">Grayscale Depth</th>
                        <th id="table-heading-color">Color Depth</th>
                        <th id="table-heading-url">URL</th>
                        <th id="table-heading-apikey">API Key</th>
                    </tr>
                </thead>
                <tbody id="device-table-body">

                </tbody>
            </table>
            <button type="button" id="add-device-btn">Add a Device</button>
            <button type="submit">Save</button>
        </form>
    </body>
</html>
